        function saveData() {

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            const filterTeacher = document.getElementById('filter-teacher').value;
            const filterClass = document.getElementById('filter-class').value;

            ktpData.forEach((row, index) => {
                if (filterTeacher && row.teacher !== filterTeacher) return;
                if (filterClass && row.class !== filterClass) return;

                const tr = document.createElement('tr');
                
                // Цветовая индикация статуса
                if (row.status === 'Проведено') {
                    tr.className = 'bg-green-50 hover:bg-green-100 transition-colors';
                } else {
                    tr.className = 'bg-yellow-50 hover:bg-yellow-100 transition-colors border-b';
                }
                
                tr.innerHTML = `
                    <td class="p-3 border-b border-gray-200 font-medium">${row.teacher}</td>
                    <td class="p-3 border-b border-gray-200 text-center">${row.class}</td>
                    <td class="p-3 border-b border-gray-200">${row.subject}</td>
                    <td class="p-3 border-b border-gray-200 font-medium">${row.topic}</td>
                    <td class="p-3 border-b border-gray-200">
                        <input type="date" value="${row.date || ''}" onchange="updateDate(${index}, this.value)" 
                               class="border border-gray-300 p-1 w-full rounded focus:ring-blue-500 bg-white bg-opacity-70">
                    </td>
                    <td class="p-3 border-b border-gray-200">
                        <select onchange="updateStatus(${index}, this.value)" 
                                class="border border-gray-300 p-1 w-full rounded focus:ring-blue-500 bg-white bg-opacity-70 font-medium ${row.status === 'Проведено' ? 'text-green-700' : 'text-yellow-700'}">

                    </td>
                    <td class="p-3 border-b border-gray-200 text-center">

        function addRow() {
            document.getElementById('add-modal').classList.remove('hidden');

        function closeModal() {
            document.getElementById('add-modal').classList.add('hidden');

            const cls = document.getElementById('new-class').value;
